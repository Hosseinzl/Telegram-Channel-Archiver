version: "3.9"

services:
  channel-archiver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faraz-channel-archiver
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://host.docker.internal:27017
      - SESSION_PATH=/data
    volumes:
      - ./session_data:/data